name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: Generate Astro types
        run: vp exec astro sync

      - name: Format, lint and type-aware lint
        run: vp check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: Typecheck
        run: vp run typecheck
